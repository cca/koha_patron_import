[project]
name = "patron-import"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click==8.5.0",
    # needed for pydantic EmailStr even though it is not imported directly
    "email-validator==2.3",
    "pydantic==2.13.5",
    "requests==2.34.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.ruff.lint]
# Bugbear, Pyflakes, import sorting, syntax upgrades, security, simplicity
select = ["A", "B", "F", "I", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Allow `assert` statements in test files
"**/test*.py" = ["S"]
